services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # Event notification -> API webhook. queue_dir persists events on disk, so they are
      # redelivered if the API is down.
      MINIO_NOTIFY_WEBHOOK_ENABLE_RAGAPI: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_RAGAPI: "http://api:8000/internal/minio-events"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_RAGAPI: ${MINIO_WEBHOOK_TOKEN}
      MINIO_NOTIFY_WEBHOOK_QUEUE_DIR_RAGAPI: "/data/.event-queue"
      MINIO_NOTIFY_WEBHOOK_QUEUE_LIMIT_RAGAPI: "10000"
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; do sleep 1; done;
      mc mb --ignore-existing local/${MINIO_BUCKET};
      (mc event list local/${MINIO_BUCKET} | grep -q RAGAPI) || mc event add local/${MINIO_BUCKET} arn:minio:sqs::RAGAPI:webhook --event put;
      echo 'minio ready';
      "

  api:
    build: ./api
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports: ["8000:8000"]
    volumes: ["./api:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  worker:
    build: ./worker
    env_file: .env
    # -B embeds beat (hourly cleanup task). In production, run it as a separate service.
    command: celery -A celery_app worker -B -s /tmp/celerybeat-schedule --loglevel=INFO --concurrency=2
    volumes: ["./worker:/app"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  flower:
    build: ./worker
    env_file: .env
    command: celery -A celery_app flower --port=5555 --basic-auth=${FLOWER_USER}:${FLOWER_PASSWORD}
    ports: ["5555:5555"]
    depends_on:
      redis: {condition: service_healthy}

  # Optional: local LLM and embeddings.  docker compose --profile local-llm up
  ollama:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    volumes: [ollama:/root/.ollama]
    ports: ["11434:11434"]

  ollama-init:
    image: ollama/ollama:latest
    profiles: ["local-llm"]
    depends_on: [ollama]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: >
      /bin/sh -c "
      until ollama list >/dev/null 2>&1; do sleep 2; done;
      ollama pull ${EMBEDDING_MODEL:-bge-m3};
      ollama pull ${LLM_MODEL:-llama3.2:3b};
      echo 'models ready';
      "

volumes:
  pgdata:
  miniodata:
  ollama:
